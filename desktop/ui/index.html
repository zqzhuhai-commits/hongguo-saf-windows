<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; media-src http://127.0.0.1:* blob:; connect-src 'self' http://127.0.0.1:*; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>红果短剧Win客户端SAF版</title>
  <link rel="icon" href="../assets/app.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img class="brand-mark" src="../assets/app.png" alt=""><div>红果短剧Win客户端SAF版<small>WINDOWS DESKTOP</small></div></div>
    <p class="nav-caption">发现好故事</p>
    <nav aria-label="主导航">
      <button data-nav="home" class="nav active"><span>⌂</span>首页</button>
      <button data-nav="ranking" class="nav"><span>↗</span>漫剧排行榜</button>
      <div class="nav-divider"></div>
      <p class="nav-caption">我的片单</p>
      <button data-nav="favorites" class="nav"><span>♡</span>收藏<span id="favorite-count" class="count">0</span></button>
      <button data-nav="later" class="nav"><span>＋</span>稍后看</button>
      <button data-nav="history" class="nav"><span>◷</span>最近观看</button>
    </nav>
    <div class="sidebar-bottom"><button data-nav="settings" class="nav"><span>⚙</span>设置</button><small>非官方客户端 · 本机保存记录<br><span id="version">桌面移植版</span></small></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="type-switch" aria-label="内容类型"><button data-type="comic" class="active">漫剧</button><button data-type="short">短剧</button></div>
      <form id="search-form" class="search"><span>⌕</span><input id="query" aria-label="搜索剧名" placeholder="搜索剧名，发现下一部好剧" maxlength="80" autocomplete="off"><button type="submit">搜索</button></form>
      <button id="fullscreen" class="icon-button" title="全屏 F11" aria-label="全屏">⛶</button>
    </header>
    <main id="content" aria-live="polite"></main>
    <footer>红果短剧Win客户端SAF版<span>记录保存在当前电脑 · 无需安卓模拟器</span></footer>
  </div>
  <dialog id="detail-dialog" aria-label="剧集详情"><div id="detail-content"></div></dialog>
  <section id="player" hidden aria-label="视频播放器">
    <div class="player-top"><button id="close-player" class="button">← 返回</button><div><h2 id="playing-title"></h2><span id="playing-info"></span></div><button id="player-fullscreen" class="icon-button" aria-label="播放器全屏">⛶</button></div>
    <div class="video-stage"><video id="video" controls playsinline preload="metadata"></video><div id="player-loading" class="player-status" hidden><div class="spinner"></div><p>正在准备播放…</p></div><div id="player-error" class="player-status" hidden><h3>暂时无法播放</h3><p id="player-error-text"></p><button id="retry-player" class="button primary">重新播放</button></div></div>
    <div class="player-bottom"><div class="player-actions"><button id="previous-episode" class="button">上一集</button><button id="next-episode" class="button">下一集</button><button id="show-episodes" class="button">选集</button><button id="seek-back" class="button" title="左方向键">−10 秒</button><button id="seek-forward" class="button" title="右方向键">＋10 秒</button></div>
      <div class="player-options"><label>清晰度 <select id="player-quality"><option value="480">480P</option><option value="720">720P</option><option value="1080">1080P</option></select></label><label>倍速 <select id="player-speed"><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label><label>停止 <select id="sleep-timer"><option value="0">不定时</option><option value="15">15 分钟后</option><option value="30">30 分钟后</option><option value="60">60 分钟后</option><option value="90">90 分钟后</option><option value="end">本集结束</option><option value="3episodes">再播完 3 集</option><option value="5episodes">再播完 5 集</option></select></label></div>
    </div>
    <div id="player-episodes" hidden><div class="section-heading"><h3>选集</h3><button id="hide-episodes" class="button">收起</button></div><div id="player-episode-grid" class="episode-grid"></div></div>
  </section>
  <div id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
